<!doctype html>
<html lang="zh-CN" data-theme="daylight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BioTrace</title>
    <script>
      if (/Android/i.test(navigator.userAgent)) {
        document.documentElement.setAttribute("data-webview", "android");
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 每次部署都会换掉带哈希的产物名并删掉旧文件。WebView 若攥着缓存里的旧
      // index.html，它请求的 JS/CSS 已不存在，会被 SPA 兜底成 HTML，页面就一直
      // 停在空背景。等不到挂载就带时间戳重取一次，绕开那条缓存记录。
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && root.childElementCount > 0) return;
        try {
          if (sessionStorage.getItem("bt-boot-retry")) return;
          sessionStorage.setItem("bt-boot-retry", "1");
        } catch (err) {
          return;
        }
        var url = new URL(location.href);
        url.searchParams.set("fresh", String(Date.now()));
        location.replace(url.toString());
      }, 10000);
    </script>
  </body>
</html>
