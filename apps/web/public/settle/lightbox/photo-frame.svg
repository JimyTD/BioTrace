<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Slide mount for the reveal stage. Window: x=6 y=6 w=88 h=88 (6% inset). -->
  <defs>
    <mask id="settleMount" maskUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#fff" />
      <rect x="6" y="6" width="88" height="88" fill="#000" />
    </mask>
  </defs>
  <rect width="100" height="100" fill="#eee9de" mask="url(#settleMount)" />
  <rect x="6" y="6" width="88" height="88" stroke="#26414f" stroke-opacity="0.34" stroke-width="0.7" />
  <rect x="0.4" y="0.4" width="99.2" height="99.2" stroke="#26414f" stroke-opacity="0.2" stroke-width="0.8" />
  <rect x="7" y="2.2" width="12" height="1.1" fill="#4c4740" fill-opacity="0.28" />
  <rect x="7" y="96.7" width="20" height="1.2" fill="#4c4740" fill-opacity="0.34" />
  <rect x="86" y="96.7" width="7" height="1.2" fill="#4c4740" fill-opacity="0.34" />
</svg>
