<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>开包美术预览 · BioTrace</title>
    <style>
      :root {
        --card: #f7f2e8; --ink: #2a241c; --muted: #6b6358; --line: #d9d0c2; --cta: #c45c3a;
        --surface-wash: #efe6d6;
        --rarity-N-bg: #ebe9e3; --rarity-N-fg: #4a4f48;
        --rarity-R-bg: #c8e8ff; --rarity-R-fg: #0b6aa8;
        --rarity-SR-bg: #f0d8ff; --rarity-SR-fg: #7a22c8;
        --rarity-SSR-bg: #ffe566; --rarity-SSR-fg: #6b4200;
        --rarity-UR-bg: #ffb8b4; --rarity-UR-fg: #b00018;
        --rarity-LR-bg: #f3e2ff; --rarity-LR-fg: #5a1a6e;
        --rarity-XR-bg: #ffc2f0; --rarity-XR-fg: #9a0070;
        --rarity-N-seal: #7a7e78; --rarity-N-seal-ink: #f7f5f0;
        --rarity-R-seal: #2eb0f0; --rarity-R-seal-ink: #f0faff;
        --rarity-SR-seal: #b14ef0; --rarity-SR-seal-ink: #fcf4ff;
        --rarity-SSR-seal: #f0c400; --rarity-SSR-seal-ink: #3a2800;
        --rarity-UR-seal: #ff1f3a; --rarity-UR-seal-ink: #fff0f0;
        --rarity-LR-seal: #f0c400; --rarity-LR-seal-ink: #1a1028;
        --rarity-XR-seal: #ff00a8; --rarity-XR-seal-ink: #fff5fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 20px 16px 48px;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #f3ebe0, #e7ddd0);
      }
      h1 { margin: 0 0 6px; font-size: 1.45rem; }
      .lede { margin: 0 0 14px; color: var(--muted); }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      button {
        border: 1px solid var(--line); background: #fffaf2; color: var(--ink);
        border-radius: 10px; padding: 8px 12px; cursor: pointer; font: inherit;
      }
      button.active, button.primary { border-color: var(--cta); color: var(--cta); }
      button.primary { background: var(--cta); color: #fffaf2; min-width: 8rem; }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 16px;
        padding: 16px; max-width: 520px; box-shadow: 0 10px 28px rgba(42,36,28,.08);
      }
      .stage {
        position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 12px;
        overflow: hidden; background: var(--surface-wash);
      }
      .pack-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .stage.is-sealed .pack-bg { filter: saturate(.85) brightness(.92); }
      .photo-mat { position: absolute; z-index: 1; box-sizing: border-box; }
      .stage.is-sealed .photo-mat, .stage.is-revealing .photo-mat {
        top: 23.9%; right: 36.1%; bottom: 24.6%; left: 16.3%;
      }
      .stage.is-open .photo-mat {
        inset: 8%; top: 8%; right: 8%; bottom: 8%; left: 8%;
        width: auto; height: auto; max-width: none; max-height: none;
        aspect-ratio: auto; transform: none;
      }
      .photo-window {
        position: absolute; inset: 0; overflow: hidden; background: #2a241c;
      }
      .stage.is-open .photo-window {
        inset: 5%; border-radius: 2px;
        background: color-mix(in srgb, var(--surface-wash) 70%, #2a241c);
      }
      .photo-window img {
        width: 100%; height: 100%; object-fit: contain; object-position: center; display: block;
      }
      .blur { filter: blur(12px) saturate(.85); transform: scale(1.08); }
      .frame, .shell { position: absolute; pointer-events: none; }
      .frame { inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
      .shell { inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 3; }
      .stage.is-revealing .shell { animation: shellLift 700ms ease forwards; }
      @keyframes shellLift { to { opacity: 0; transform: translateY(-6%) scale(1.03); } }
      .seal {
        --seal-wax: var(--rarity-SR-seal); --seal-ink: var(--rarity-SR-seal-ink);
        position: absolute; z-index: 4; right: 3%; bottom: 5%;
        width: min(30%, 8rem); aspect-ratio: 1; color: var(--seal-wax);
        background: transparent;
      }
      .seal-svg { position: absolute; inset: 0; }
      .seal-svg svg {
        display: block; width: 100%; height: 100%; overflow: visible;
        filter: drop-shadow(0 2px 4px rgba(42,36,28,.28));
      }
      .seal span {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-weight: 800; font-size: clamp(1.15rem, 5.2vw, 1.7rem);
        color: var(--seal-ink); z-index: 1;
      }
      .seal span::before {
        content: ""; position: absolute; width: 42%; height: 42%; border-radius: 50%;
        background: color-mix(in srgb, var(--seal-wax) 88%, #1a1200); z-index: -1;
      }
      .actions { display: grid; justify-items: center; margin-top: 14px; }
      .name { display: block; margin-top: 12px; font-size: 1.35rem; font-weight: 700; }
      .muted { color: var(--muted); font-size: .92rem; }
      .kicker { margin: 24px 0 10px; color: var(--muted); font-size: .8rem; }
      .badge-strip, .seal-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
      .badge {
        display: inline-flex; padding: 4px 10px; border-radius: 999px;
        font-size: .82rem; font-weight: 700;
      }
      .badge.lr { background: linear-gradient(135deg, #e0c4ff, #ffe566, #ffb0d8) !important; }
      .seal-chip {
        --seal-wax: var(--rarity-N-seal); --seal-ink: var(--rarity-N-seal-ink);
        position: relative; width: 72px; height: 72px; color: var(--seal-wax);
        background: transparent;
      }
      .seal-chip .seal-svg { inset: 0; }
      .seal-chip .seal-svg svg {
        filter: drop-shadow(0 1px 3px rgba(42,36,28,.25));
      }
      .seal-chip span {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-weight: 800; color: var(--seal-ink); z-index: 1;
      }
      .seal-chip span::before {
        content: ""; position: absolute; width: 42%; height: 42%; border-radius: 50%;
        background: color-mix(in srgb, var(--seal-wax) 88%, #1a1200); z-index: -1;
      }
      .hidden { display: none !important; }
      .check { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; font-size: .9rem; }
    </style>
  </head>
  <body>
    <h1>开包美术预览</h1>
    <p class="lede">本地静态验收：章必须无方底；展出照片居中 contain，不能飞角落。</p>
    <p class="check">验收：① SR/LR 章外无彩色方块　② 点「展出」照片在纸心中间</p>

    <div class="row" id="phases">
      <button type="button" data-phase="sealed" class="active">封缄</button>
      <button type="button" data-phase="revealing">揭示中</button>
      <button type="button" data-phase="open">展出</button>
    </div>

    <div class="card">
      <div class="stage is-sealed" id="stage">
        <img class="pack-bg" src="./daylight/pack-bg.png" alt="" />
        <div class="photo-mat">
          <div class="photo-window">
            <img id="photo" class="blur" src="../volumes/daylight/cover-intertidal.png" alt="示例" />
          </div>
          <img class="frame hidden" id="frame" src="./daylight/photo-frame.svg" alt="" />
        </div>
        <img class="shell" id="shell" src="./daylight/pack-sealed.png" alt="" />
        <div class="seal hidden" id="seal">
          <div class="seal-svg" id="sealSvg" aria-hidden></div>
          <span id="rank">SR</span>
        </div>
      </div>
      <div class="actions" id="openWrap">
        <button type="button" class="primary" id="openBtn">请过目</button>
      </div>
      <p class="muted hidden" id="opening">请稍候…</p>
      <div id="openCopy" class="hidden">
        <strong class="name">示例标本</strong>
        <p class="muted" id="rankLabel">SR · 稀有</p>
      </div>
    </div>

    <p class="kicker">徽章</p>
    <div class="badge-strip" id="badgeStrip"></div>
    <p class="kicker">火漆（内联 SVG，无 mask）</p>
    <div class="seal-strip" id="sealStrip"></div>
    <div class="row" id="rarities">
      <button type="button" data-r="N">N</button>
      <button type="button" data-r="R">R</button>
      <button type="button" data-r="SR" class="active">SR</button>
      <button type="button" data-r="SSR">SSR</button>
      <button type="button" data-r="UR">UR</button>
      <button type="button" data-r="LR">LR</button>
      <button type="button" data-r="XR">XR</button>
    </div>

    <script>
      const ROUND =
        "M64 6 L70.85 11.95 L79.01 7.98 L84.09 15.5 L93 13.77 L95.96 22.35 L105.01 22.99 L105.65 32.04 L114.23 35 L112.5 43.91 L120.02 48.99 L116.05 57.15 L122 64 L116.05 70.85 L120.02 79.01 L112.5 84.09 L114.23 93 L105.65 95.96 L105.01 105.01 L95.96 105.65 L93 114.23 L84.09 112.5 L79.01 120.02 L70.85 116.05 L64 122 L57.15 116.05 L48.99 120.02 L43.91 112.5 L35 114.23 L32.04 105.65 L22.99 105.01 L22.35 95.96 L13.77 93 L15.5 84.09 L7.98 79.01 L11.95 70.85 L6 64 L11.95 57.15 L7.98 48.99 L15.5 43.91 L13.77 35 L22.35 32.04 L22.99 22.99 L32.04 22.35 L35 13.77 L43.91 15.5 L48.99 7.98 L57.15 11.95 Z M98 64 A34 34 0 1 1 30 64 A34 34 0 1 1 98 64 Z";
      const XR =
        "M6 64 L9.87 32.75 L35 13.77 L64 1.5 L93 13.77 L118.13 32.75 L122 64 L118.13 95.25 L93 114.23 L64 126.5 L35 114.23 L9.87 95.25 Z M30 64 L47 34.56 L81 34.56 L98 64 L81 93.44 L47 93.44 Z";
      const GRAD = {
        SSR: ["#fff6c8", "#ffd54a", "#f0c400", "#b87800", "#a86f00"],
        LR: ["#b14ef0", "#2eb0f0", "#f0c400", "#ff1f3a", "#ff00a8"],
        UR: ["#ff8a96", "#ff1f3a", "#b00018"],
        XR: ["#ff9ae0", "#ff00a8", "#b00070"],
      };
      function sealSvg(r, id) {
        const path = r === "XR" ? XR : ROUND;
        const shine =
          `<linearGradient id="s${id}" x1="0" y1="0" x2="1" y2="1">` +
          `<stop offset="0%" stop-color="#fff" stop-opacity=".7"/>` +
          `<stop offset="40%" stop-color="#fff" stop-opacity="0"/>` +
          `<stop offset="50%" stop-color="#fff" stop-opacity=".35"/>` +
          `<stop offset="65%" stop-color="#fff" stop-opacity="0"/></linearGradient>`;
        if (GRAD[r]) {
          const stops = GRAD[r]
            .map((c, i) => `<stop offset="${(i / (GRAD[r].length - 1)) * 100}%" stop-color="${c}"/>`)
            .join("");
          return (
            `<svg viewBox="0 0 128 128" width="100%" height="100%"><defs>` +
            `<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient>${shine}` +
            `</defs><path fill="url(#g${id})" fill-rule="evenodd" d="${path}"/>` +
            `<path fill="url(#s${id})" fill-rule="evenodd" d="${path}"/></svg>`
          );
        }
        return (
          `<svg viewBox="0 0 128 128" width="100%" height="100%"><defs>${shine}</defs>` +
          `<path fill="currentColor" fill-rule="evenodd" d="${path}"/>` +
          `<path fill="url(#s${id})" fill-rule="evenodd" d="${path}"/></svg>`
        );
      }

      const labels = {
        N: "N · 常见", R: "R · 少见", SR: "SR · 稀有", SSR: "SSR · 非常稀有",
        UR: "UR · 极稀有", LR: "LR · 传说", XR: "XR · 近乎不可能",
      };
      const seals = {
        N: ["var(--rarity-N-seal)", "var(--rarity-N-seal-ink)"],
        R: ["var(--rarity-R-seal)", "var(--rarity-R-seal-ink)"],
        SR: ["var(--rarity-SR-seal)", "var(--rarity-SR-seal-ink)"],
        SSR: ["var(--rarity-SSR-seal)", "var(--rarity-SSR-seal-ink)"],
        UR: ["var(--rarity-UR-seal)", "var(--rarity-UR-seal-ink)"],
        LR: ["var(--rarity-LR-seal)", "var(--rarity-LR-seal-ink)"],
        XR: ["var(--rarity-XR-seal)", "var(--rarity-XR-seal-ink)"],
      };

      const params = new URLSearchParams(location.search);
      let phase = ["sealed", "revealing", "open"].includes(params.get("phase") || "")
        ? params.get("phase")
        : "sealed";
      let rarity = ["N", "R", "SR", "SSR", "UR", "LR", "XR"].includes(params.get("r") || "")
        ? params.get("r")
        : "SR";
      const stage = document.getElementById("stage");
      const photo = document.getElementById("photo");
      const frame = document.getElementById("frame");
      const shell = document.getElementById("shell");
      const seal = document.getElementById("seal");

      function pick(r) {
        rarity = r;
        document.querySelectorAll("#rarities button").forEach((x) => {
          x.classList.toggle("active", x.dataset.r === r);
        });
        phase = "open";
        render();
      }

      let i = 0;
      Object.keys(seals).forEach((r) => {
        const badge = document.createElement("span");
        badge.className = "badge" + (r === "LR" ? " lr" : "");
        badge.textContent = labels[r];
        badge.style.background = "var(--rarity-" + r + "-bg)";
        badge.style.color = "var(--rarity-" + r + "-fg)";
        badge.onclick = () => pick(r);
        document.getElementById("badgeStrip").appendChild(badge);

        const chip = document.createElement("div");
        chip.className = "seal-chip";
        chip.style.setProperty("--seal-wax", seals[r][0]);
        chip.style.setProperty("--seal-ink", seals[r][1]);
        chip.innerHTML = `<div class="seal-svg">${sealSvg(r, "c" + i++)}</div><span>${r}</span>`;
        chip.title = labels[r];
        chip.onclick = () => pick(r);
        document.getElementById("sealStrip").appendChild(chip);
      });

      function render() {
        stage.className =
          "stage " +
          (phase === "sealed"
            ? "is-sealed"
            : phase === "revealing"
              ? "is-revealing is-sealed"
              : "is-open");
        photo.className = phase === "open" ? "" : "blur";
        frame.classList.toggle("hidden", phase === "sealed");
        shell.classList.toggle("hidden", phase === "open");
        seal.classList.toggle("hidden", phase !== "open");
        document.getElementById("openWrap").classList.toggle("hidden", phase !== "sealed");
        document.getElementById("opening").classList.toggle("hidden", phase !== "revealing");
        document.getElementById("openCopy").classList.toggle("hidden", phase !== "open");
        document.querySelectorAll("#phases button").forEach((b) => {
          b.classList.toggle("active", b.dataset.phase === phase);
        });
        const [wax, ink] = seals[rarity];
        seal.style.setProperty("--seal-wax", wax);
        seal.style.setProperty("--seal-ink", ink);
        document.getElementById("sealSvg").innerHTML = sealSvg(rarity, "main");
        document.getElementById("rank").textContent = rarity;
        document.getElementById("rankLabel").textContent = labels[rarity];
        document.getElementById("rankLabel").style.color = "var(--rarity-" + rarity + "-fg)";
      }

      document.getElementById("phases").onclick = (e) => {
        const b = e.target.closest("button[data-phase]");
        if (!b) return;
        phase = b.dataset.phase;
        render();
      };
      document.getElementById("rarities").onclick = (e) => {
        const b = e.target.closest("button[data-r]");
        if (!b) return;
        pick(b.dataset.r);
      };
      document.getElementById("openBtn").onclick = () => {
        phase = "revealing";
        render();
        setTimeout(() => {
          phase = "open";
          render();
        }, 700);
      };
      render();
    </script>
  </body>
</html>
