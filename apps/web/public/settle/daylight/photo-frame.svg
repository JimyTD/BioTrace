<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Specimen photo frame only. Window: x=6 y=6 w=88 h=88 (6% inset). Center transparent. -->
  <defs>
    <mask id="settleRim" maskUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="6" y="6" width="88" height="88" fill="#000"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="#5c534a" fill-opacity="0.28" mask="url(#settleRim)"/>
  <rect x="6" y="6" width="88" height="88" stroke="#3a322c" stroke-opacity="0.45" stroke-width="0.7"/>
  <rect x="4" y="4" width="92" height="92" stroke="#3a322c" stroke-opacity="0.2" stroke-width="0.4"/>
</svg>
