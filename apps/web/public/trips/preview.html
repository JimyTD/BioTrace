<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旅途页 · 真布局预览</title>
    <style>
      :root {
        --ink: #1f2a24; --muted: #6b6258; --line: rgba(42, 64, 51, 0.14);
        --card: #faf8f3; --cta: #d3543c; --cta-ink: #fffaf7;
        --nav-bg: #f3efe7; --nav-active-bg: #f0ddd4; --nav-active-ink: #9a4030;
        --plate: #efe6d6; --shadow: 0 10px 26px rgba(42, 36, 28, 0.1);
        --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --bg:
          radial-gradient(900px 480px at 8% -8%, rgba(212, 168, 120, 0.22), transparent 55%),
          linear-gradient(180deg, #f3efe7, #ebe6dc);
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px 12px 40px; font-family: var(--font); color: var(--ink); background: #d9d0c2; }
      h1 { margin: 0 0 8px; font-size: 1.15rem; }
      .note { margin: 0 0 14px; color: #5a5248; font-size: 0.88rem; max-width: 48ch; }
      .phones { display: flex; flex-wrap: wrap; gap: 18px; }
      .phone {
        width: min(100%, 360px); min-height: 640px; background: var(--bg);
        border-radius: 22px; border: 1px solid rgba(42,36,28,.18);
        box-shadow: 0 16px 40px rgba(42,36,28,.14);
        display: grid; grid-template-rows: 1fr auto; overflow: hidden;
      }
      .content { padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0)); display: grid; gap: 14px; align-content: start; }
      .label { margin: 0 0 6px; font-size: 0.75rem; color: #5a5248; }
      .title { margin: 0; font-size: 1.45rem; font-weight: 700; }
      .lede { margin: 0; color: var(--muted); font-size: 0.95rem; }
      .create {
        display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 12px;
        border-radius: 11px; background: #f3ebe0; border: 1px solid var(--line);
      }
      .create input { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; background: #fffdf9; }
      .btn { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font: inherit; background: #fffaf2; }
      .btn.primary { background: var(--cta); color: var(--cta-ink); border-color: transparent; }
      .covers { display: grid; gap: 18px; }
      .media {
        position: relative; aspect-ratio: 3/2; border-radius: 12px; overflow: hidden;
        background: var(--plate); box-shadow: var(--shadow);
      }
      .media .photo { position: absolute; inset: 6% 5.3%; width: auto; height: auto; object-fit: cover; }
      .media .ph {
        position: absolute; inset: 6% 5.3%;
        background: linear-gradient(145deg, rgba(211,84,60,.1), transparent 55%), var(--plate);
      }
      .media .frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 1; }
      .meta strong { display: block; font-size: 1.12rem; }
      .meta span { color: var(--muted); font-size: 0.9rem; }
      .empty { padding: 28px 8px 12px; }
      .caption { margin: 0 auto; color: var(--muted); text-align: center; max-width: 26ch; font-size: 0.92rem; }
      .film { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; }
      .tile-media {
        position: relative; aspect-ratio: 1; border-radius: 3px; overflow: hidden;
        background: var(--plate); box-shadow: 0 4px 14px rgba(42,36,28,.08);
      }
      .tile-media .photo { position: absolute; inset: 8%; width: 84%; height: 84%; object-fit: cover; }
      .tile-media .frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
      .nav {
        position: sticky; bottom: 0; z-index: 30;
        display: grid; grid-template-columns: repeat(4,1fr);
        padding: 8px 10px; background: var(--nav-bg); border-top: 1px solid var(--line);
      }
      .nav span { text-align: center; font-size: 0.72rem; color: var(--muted); padding: 8px 4px; border-radius: 10px; }
      .nav span.on { background: var(--nav-active-bg); color: var(--nav-active-ink); font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>旅途页 · 真布局预览</h1>
    <p class="note">封面框边垫须看得见；空态不再塞整幅插画；底栏 z-index 压住内容，防穿模。</p>
    <div class="phones">
      <div>
        <p class="label">1 · 列表空态</p>
        <div class="phone">
          <div class="content">
            <h2 class="title">旅途</h2>
            <p class="lede">每一次出门，都是一本新相册。</p>
            <div class="create"><input readonly /><button class="btn" type="button">开册</button></div>
            <div class="empty"><p class="caption">还没有旅途。写下名字，翻开第一页。</p></div>
          </div>
          <nav class="nav"><span class="on">旅途</span><span>地图</span><span>图鉴</span><span>我的</span></nav>
        </div>
      </div>
      <div>
        <p class="label">2 · 封面墙（无图纸垫 / 有图）</p>
        <div class="phone">
          <div class="content">
            <h2 class="title">旅途</h2>
            <p class="lede">每一次出门，都是一本新相册。</p>
            <div class="create"><input readonly /><button class="btn" type="button">开册</button></div>
            <div class="covers">
              <div>
                <div class="media">
                  <div class="ph"></div>
                  <img class="frame" src="./daylight/cover-frame.svg" alt="" />
                </div>
                <div class="meta"><strong>清明回乡</strong><span>还没有照片</span></div>
              </div>
              <div>
                <div class="media">
                  <img class="photo" src="../volumes/daylight/cover-intertidal.png" alt="" />
                  <img class="frame" src="./daylight/cover-frame.svg" alt="" />
                </div>
                <div class="meta"><strong>潮间带午后</strong><span>3 张照片 · 厦门</span></div>
              </div>
            </div>
          </div>
          <nav class="nav"><span class="on">旅途</span><span>地图</span><span>图鉴</span><span>我的</span></nav>
        </div>
      </div>
      <div>
        <p class="label">3 · 胶片格（保留）</p>
        <div class="phone">
          <div class="content">
            <h2 class="title">潮间带午后</h2>
            <p class="lede">选几张照片放进这本册子，我们来认一认。</p>
            <button class="btn primary" type="button">加入照片</button>
            <div class="film">
              <div class="tile-media">
                <img class="photo" src="../volumes/daylight/cover-intertidal.png" alt="" />
                <img class="frame" src="./daylight/film-frame.svg" alt="" />
              </div>
              <div class="tile-media">
                <img class="photo" src="../volumes/daylight/cover-urban_wild.png" alt="" />
                <img class="frame" src="./daylight/film-frame.svg" alt="" />
              </div>
            </div>
          </div>
          <nav class="nav"><span class="on">旅途</span><span>地图</span><span>图鉴</span><span>我的</span></nav>
        </div>
      </div>
    </div>
  </body>
</html>
