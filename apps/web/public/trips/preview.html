<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旅途列表 · 改前 / 改后</title>
    <style>
      :root {
        --ink: #1f2a24; --muted: #6b6258; --line: rgba(42, 64, 51, 0.14);
        --nav-bg: #f3efe7; --nav-active-ink: #9a4030;
        --plate: #efe6d6; --share-bg: #f0ddd4; --share-ink: #9a4030;
        --create: #f3ebe0; --shadow: 0 10px 26px rgba(42, 36, 28, 0.1);
        --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --bg:
          radial-gradient(900px 480px at 8% -8%, rgba(212, 168, 120, 0.22), transparent 55%),
          linear-gradient(180deg, #f3efe7, #ebe6dc);
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px 12px 40px; font-family: var(--font); color: var(--ink); background: #d9d0c2; }
      h1.doc { margin: 0 0 8px; font-size: 1.15rem; }
      .note { margin: 0 0 10px; color: #5a5248; font-size: 0.92rem; max-width: 56ch; }
      .diffs { margin: 0 0 16px; padding-left: 1.2em; color: #5a5248; font-size: 0.92rem; max-width: 56ch; }
      .phones { display: flex; flex-wrap: wrap; gap: 18px; }
      .phone {
        width: min(100%, 360px); height: 640px; background: var(--bg);
        border-radius: 22px; border: 1px solid rgba(42,36,28,.18);
        box-shadow: 0 16px 40px rgba(42,36,28,.14);
        display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
      }
      .topbar {
        padding: 12px 16px 10px; background: var(--nav-bg);
        border-bottom: 1px solid var(--line); font-weight: 700;
      }
      .content {
        min-height: 0; overflow-y: auto; padding: 16px;
        display: grid; gap: 12px; align-content: start;
      }
      .label { margin: 0 0 6px; font-size: 0.8rem; font-weight: 700; color: #5a5248; }
      .title { margin: 0; font-size: 1.45rem; font-weight: 700; }
      .lede { margin: 0; color: var(--muted); font-size: 0.95rem; }
      .form {
        display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
        padding: 10px 12px; border-radius: 11px;
        background: var(--create); border: 1px solid var(--line);
      }
      .form input {
        border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
        font: inherit; background: #fffdf9;
      }
      .slip {
        display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
        padding: 2px 4px 2px 12px; border-radius: 8px;
        background: var(--create); border: 1px solid var(--line);
      }
      .slip input { border: 0; background: transparent; padding: 8px 0; font: inherit; color: var(--muted); }
      .btn { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: inherit; background: #fffaf2; }
      .join { color: var(--muted); font-size: 0.92rem; }
      .covers { display: grid; gap: 18px; }
      .media {
        position: relative; aspect-ratio: 3/2; border-radius: 12px; overflow: hidden;
        background: var(--plate); box-shadow: var(--shadow);
      }
      .media .window {
        position: absolute; top: 6%; left: 6%; width: 88%; height: 88%; overflow: hidden;
      }
      .media .photo { width: 100%; height: 100%; object-fit: cover; display: block; }
      .media .frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 1; }
      .share {
        position: absolute; top: 8%; right: 8%; z-index: 2;
        padding: 2px 8px; border-radius: 8px; background: var(--share-bg); color: var(--share-ink);
        font-size: 0.72rem; font-weight: 700;
      }
      .meta strong { display: block; font-size: 1.12rem; }
      .meta span { display: block; color: var(--muted); font-size: 0.9rem; }
      .nav {
        display: grid; grid-template-columns: repeat(4, 1fr);
        padding: 0 4px 8px; background: var(--nav-bg); border-top: 1px solid var(--line);
      }
      .nav span {
        position: relative; text-align: center; font-size: 0.86rem;
        color: var(--muted); padding: 12px 6px 14px;
      }
      .nav span.on { color: var(--nav-active-ink); font-weight: 700; }
      .nav span.on::after {
        content: ""; position: absolute; left: 22%; right: 22%; bottom: 6px;
        height: 2px; border-radius: 1px; background: var(--nav-active-ink);
      }
    </style>
  </head>
  <body>
    <h1 class="doc">旅途列表 · 改前 / 改后</h1>
    <p class="note">这一刀只动三处，封面墙本身几乎没变。左右对照看：</p>
    <ul class="diffs">
      <li>上面两条输入框 → 左边只留一条细题签，加入码收成一行字</li>
      <li>标题下「共享 · 2 人同行」那一行 → 挪到封面右上角小标</li>
      <li>标题下只留一行：3 张照片 · 厦门</li>
    </ul>
    <div class="phones">
      <div>
        <p class="label">改前</p>
        <div class="phone">
          <div class="topbar">BioTrace</div>
          <div class="content">
            <h2 class="title">旅途</h2>
            <p class="lede">每一次出门，都是一本新相册。</p>
            <div class="form"><input readonly placeholder="" /><button class="btn" type="button">创建</button></div>
            <div class="form"><input readonly placeholder="输入共享码加入" /><button class="btn" type="button">加入旅途</button></div>
            <div class="covers">
              <div>
                <div class="media">
                  <div class="window"><img class="photo" src="./_sample-photo.jpg" alt="" /></div>
                  <img class="frame" src="./daylight/cover-frame.svg" alt="" />
                </div>
                <div class="meta">
                  <strong>潮间带午后</strong>
                  <span>3 张照片 · 厦门</span>
                  <span>共享 · 2 人同行</span>
                </div>
              </div>
            </div>
          </div>
          <nav class="nav"><span class="on">旅途</span><span>地图</span><span>图鉴</span><span>我的</span></nav>
        </div>
      </div>
      <div>
        <p class="label">改后</p>
        <div class="phone">
          <div class="topbar">BioTrace</div>
          <div class="content">
            <h2 class="title">旅途</h2>
            <p class="lede">每一次出门，都是一本新相册。</p>
            <div class="slip"><input readonly placeholder="新建旅途" /><button class="btn" type="button">创建</button></div>
            <span class="join">输入共享码加入</span>
            <div class="covers">
              <div>
                <div class="media">
                  <div class="window"><img class="photo" src="./_sample-photo.jpg" alt="" /></div>
                  <img class="frame" src="./daylight/cover-frame.svg" alt="" />
                  <span class="share">共享</span>
                </div>
                <div class="meta">
                  <strong>潮间带午后</strong>
                  <span>3 张照片 · 厦门</span>
                </div>
              </div>
            </div>
          </div>
          <nav class="nav"><span class="on">旅途</span><span>地图</span><span>图鉴</span><span>我的</span></nav>
        </div>
      </div>
    </div>
  </body>
</html>
