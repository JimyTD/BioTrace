<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Geometric film/stamp frame. Photo window: 8% inset. Center transparent. -->
  <defs>
    <mask id="tripFilmRim" maskUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="8" y="8" width="84" height="84" fill="#000"/>
      <!-- Regular perforations -->
      <circle cx="10" cy="0" r="2.15" fill="#000"/>
      <circle cx="20" cy="0" r="2.15" fill="#000"/>
      <circle cx="30" cy="0" r="2.15" fill="#000"/>
      <circle cx="40" cy="0" r="2.15" fill="#000"/>
      <circle cx="50" cy="0" r="2.15" fill="#000"/>
      <circle cx="60" cy="0" r="2.15" fill="#000"/>
      <circle cx="70" cy="0" r="2.15" fill="#000"/>
      <circle cx="80" cy="0" r="2.15" fill="#000"/>
      <circle cx="90" cy="0" r="2.15" fill="#000"/>
      <circle cx="10" cy="100" r="2.15" fill="#000"/>
      <circle cx="20" cy="100" r="2.15" fill="#000"/>
      <circle cx="30" cy="100" r="2.15" fill="#000"/>
      <circle cx="40" cy="100" r="2.15" fill="#000"/>
      <circle cx="50" cy="100" r="2.15" fill="#000"/>
      <circle cx="60" cy="100" r="2.15" fill="#000"/>
      <circle cx="70" cy="100" r="2.15" fill="#000"/>
      <circle cx="80" cy="100" r="2.15" fill="#000"/>
      <circle cx="90" cy="100" r="2.15" fill="#000"/>
      <circle cx="0" cy="10" r="2.15" fill="#000"/>
      <circle cx="0" cy="20" r="2.15" fill="#000"/>
      <circle cx="0" cy="30" r="2.15" fill="#000"/>
      <circle cx="0" cy="40" r="2.15" fill="#000"/>
      <circle cx="0" cy="50" r="2.15" fill="#000"/>
      <circle cx="0" cy="60" r="2.15" fill="#000"/>
      <circle cx="0" cy="70" r="2.15" fill="#000"/>
      <circle cx="0" cy="80" r="2.15" fill="#000"/>
      <circle cx="0" cy="90" r="2.15" fill="#000"/>
      <circle cx="100" cy="10" r="2.15" fill="#000"/>
      <circle cx="100" cy="20" r="2.15" fill="#000"/>
      <circle cx="100" cy="30" r="2.15" fill="#000"/>
      <circle cx="100" cy="40" r="2.15" fill="#000"/>
      <circle cx="100" cy="50" r="2.15" fill="#000"/>
      <circle cx="100" cy="60" r="2.15" fill="#000"/>
      <circle cx="100" cy="70" r="2.15" fill="#000"/>
      <circle cx="100" cy="80" r="2.15" fill="#000"/>
      <circle cx="100" cy="90" r="2.15" fill="#000"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="#5c534a" fill-opacity="0.38" mask="url(#tripFilmRim)"/>
  <rect x="8" y="8" width="84" height="84" stroke="#3a322c" stroke-opacity="0.38" stroke-width="0.65"/>
</svg>
