<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100" fill="none">
  <!-- Quiet plate rim for trip covers. Inner window ~6% inset; center transparent.
       Hairline etching style — match volume/settle plates, not craft scrapbook. -->
  <defs>
    <mask id="tripCoverRim" maskUnits="userSpaceOnUse">
      <rect width="150" height="100" fill="#fff"/>
      <rect x="8" y="5.5" width="134" height="89" fill="#000"/>
    </mask>
  </defs>
  <rect width="150" height="100" fill="#5c534a" fill-opacity="0.16" mask="url(#tripCoverRim)"/>
  <rect x="1" y="1" width="148" height="98" stroke="#3a322c" stroke-opacity="0.34" stroke-width="0.9"/>
  <rect x="8" y="5.5" width="134" height="89" stroke="#3a322c" stroke-opacity="0.42" stroke-width="0.55"/>
</svg>
