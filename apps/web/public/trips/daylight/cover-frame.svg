<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100" fill="none">
  <!-- Cover plate rim. Photo window: x=8 y=6 w=134 h=88 (~5–6% inset). Center transparent. -->
  <defs>
    <mask id="tripCoverRim" maskUnits="userSpaceOnUse">
      <rect width="150" height="100" fill="#fff"/>
      <rect x="8" y="6" width="134" height="88" fill="#000"/>
    </mask>
  </defs>
  <!-- Opaque-enough mat so photos don't wash the rim away -->
  <rect width="150" height="100" fill="#5c534a" fill-opacity="0.52" mask="url(#tripCoverRim)"/>
  <rect x="1.2" y="1.2" width="147.6" height="97.6" stroke="#3a322c" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="8" y="6" width="134" height="88" stroke="#3a322c" stroke-opacity="0.4" stroke-width="0.7"/>
</svg>
