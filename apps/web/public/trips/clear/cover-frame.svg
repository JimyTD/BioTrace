<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100" preserveAspectRatio="none" fill="none">
  <!--
    Slide mount for the trip cover wall. Opaque border, photo window
    x=9 y=6 w=132 h=88 (6% inset), matching the daylight contract.

    Nothing is printed here. The date and place line that belongs on the
    bottom lip is real text (.trip-cover-mark) placed by the theme's grid.
  -->
  <path
    fill="#eee9de"
    fill-rule="evenodd"
    d="M0 0 H150 V100 H0 Z M9 6 H141 V94 H9 Z"
  />
  <rect x="9.4" y="6.4" width="131.2" height="87.2" stroke="#26414f" stroke-opacity="0.3" stroke-width="0.8" />
  <rect x="0.4" y="0.4" width="149.2" height="99.2" stroke="#26414f" stroke-opacity="0.16" stroke-width="0.8" />
</svg>
