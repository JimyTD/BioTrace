<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>相册入槽 · Cut L</title>
    <style>
      :root {
        --ink: #1f2a24;
        --muted: #6b6258;
        --line: rgba(42, 64, 51, 0.14);
        --nav-bg: #f3efe7;
        --nav-active-ink: #9a4030;
        --plate: #efe6d6;
        --seal: #e4d8c4;
        --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --bg:
          radial-gradient(900px 480px at 8% -8%, rgba(212, 168, 120, 0.22), transparent 55%),
          linear-gradient(180deg, #f3efe7, #ebe6dc);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px 12px 40px;
        font-family: var(--font);
        color: var(--ink);
        background: #d9d0c2;
      }
      h1.doc { margin: 0 0 8px; font-size: 1.15rem; }
      .note { margin: 0 0 14px; color: #5a5248; font-size: 0.92rem; max-width: 56ch; }
      .phone {
        width: min(100%, 360px);
        height: 640px;
        background: var(--bg);
        border-radius: 22px;
        border: 1px solid rgba(42, 36, 28, 0.18);
        box-shadow: 0 16px 40px rgba(42, 36, 28, 0.14);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }
      .topbar {
        padding: 12px 16px 10px;
        background: var(--nav-bg);
        border-bottom: 1px solid var(--line);
        font-weight: 700;
      }
      .content {
        min-height: 0;
        overflow-y: auto;
        padding: 16px;
        display: grid;
        gap: 14px;
        align-content: start;
      }
      .title { margin: 0; font-size: 1.45rem; font-weight: 700; }
      .lede { margin: 0; color: var(--muted); font-size: 0.95rem; }
      .row { display: flex; gap: 10px; }
      button.act {
        border: 0;
        background: #d3543c;
        color: #fffaf7;
        font: inherit;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px 12px;
      }
      .tile { display: grid; gap: 6px; }
      .media {
        position: relative;
        aspect-ratio: 1;
        border-radius: 3px;
        overflow: hidden;
        background: var(--plate);
        box-shadow: 0 4px 14px rgba(42, 36, 28, 0.08);
      }
      .window {
        position: absolute;
        top: 8%;
        left: 8%;
        width: 84%;
        height: 84%;
        overflow: hidden;
      }
      .photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: translateY(0);
      }
      .frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        z-index: 2;
        pointer-events: none;
      }
      .seal {
        position: absolute;
        inset: 0 0 8% 0;
        z-index: 1;
        background: var(--seal);
        box-shadow: inset 0 0 0 1px rgba(42, 64, 51, 0.14);
        pointer-events: none;
      }
      .meta { color: var(--muted); font-size: 0.88rem; }
      .nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 0 4px 8px;
        background: var(--nav-bg);
        border-top: 1px solid var(--line);
      }
      .nav span {
        text-align: center;
        font-size: 0.86rem;
        color: var(--muted);
        padding: 12px 6px 14px;
      }
      .nav span.on { color: var(--nav-active-ink); font-weight: 700; }
    </style>
  </head>
  <body>
    <h1 class="doc">Cut L · 相册入槽</h1>
    <p class="note">
      打开后会自动推进一张。再点「加入一张」可重看。格子先在，照片从窗下卡进齿孔。旁边那张是待开包的封。须用
      <code>http://127.0.0.1:5173/trips/slot-in-preview.html</code> 打开。
    </p>
    <div class="phone">
      <div class="topbar">BioTrace</div>
      <div class="content">
        <h1 class="title">海岸线</h1>
        <p class="lede" id="lede">空齿孔等着。照片马上推进来。</p>
        <div class="row">
          <button class="act" type="button" id="add">加入一张</button>
        </div>
        <div class="grid" id="grid"></div>
      </div>
      <nav class="nav">
        <span class="on">旅途</span>
        <span>地图</span>
        <span>图鉴</span>
        <span>我的</span>
      </nav>
    </div>
    <script>
      const grid = document.getElementById("grid");
      const lede = document.getElementById("lede");
      const src = "/trips/_sample-photo.jpg";
      const frame = "/trips/daylight/film-frame.svg";

      function easeOut(t) {
        return 1 - (1 - t) ** 3;
      }

      function tween(ms, update) {
        return new Promise((resolve) => {
          const start = performance.now();
          const step = (now) => {
            const t = Math.min(1, (now - start) / ms);
            update(t);
            if (t < 1) requestAnimationFrame(step);
            else resolve();
          };
          requestAnimationFrame(step);
        });
      }

      function tile({ pending, empty }) {
        const el = document.createElement("article");
        el.className = "tile";
        el.innerHTML =
          '<div class="media">' +
          '<div class="window">' +
          (empty
            ? ""
            : '<img class="photo" src="' + src + '" alt="" />') +
          (pending ? '<div class="seal" aria-hidden></div>' : "") +
          "</div>" +
          '<img class="frame" src="' + frame + '" alt="" />' +
          "</div>" +
          '<span class="meta">' +
          (empty ? "空齿孔" : pending ? "结论已经落笔。" : "已收录") +
          "</span>";
        return el;
      }

      function waitImage(img) {
        if (img.complete && img.naturalWidth) return Promise.resolve();
        return new Promise((resolve) => {
          img.addEventListener("load", resolve, { once: true });
          img.addEventListener("error", resolve, { once: true });
        });
      }

      async function slotInto(host, pending) {
        const windowEl = host.querySelector(".window");
        const meta = host.querySelector(".meta");
        host.querySelector(".seal")?.remove();
        let img = host.querySelector(".photo");
        if (!img) {
          img = document.createElement("img");
          img.className = "photo";
          img.src = src;
          img.alt = "";
          windowEl.prepend(img);
        }
        img.style.transform = "translateY(108%)";
        await waitImage(img);
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        await tween(640, (t) => {
          img.style.transform = "translateY(" + ((1 - easeOut(t)) * 108) + "%)";
        });
        img.style.transform = "translateY(0)";
        if (pending) {
          const seal = document.createElement("div");
          seal.className = "seal";
          seal.setAttribute("aria-hidden", "");
          windowEl.append(seal);
          meta.textContent = "结论已经落笔。";
        } else {
          meta.textContent = "已收录";
        }
        lede.textContent = "推进去了。再点「加入一张」可再看一次。";
      }

      const empty = tile({ pending: false, empty: true });
      const sealed = tile({ pending: true, empty: false });
      sealed.querySelector(".photo").style.filter = "saturate(0.85) brightness(0.92)";
      grid.append(empty, sealed);

      document.getElementById("add").onclick = () => {
        const next = tile({ pending: false, empty: true });
        grid.prepend(next);
        void slotInto(next, false);
      };

      window.setTimeout(() => {
        void slotInto(empty, false);
      }, 500);
    </script>
  </body>
</html>
