<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    Slide-sheet pocket: no perforations, just the welded seams of a clear
    filing page. Photo window: x=8 y=8 w=84 h=84 (8% inset), centre transparent.
  -->
  <defs>
    <mask id="pocketRim" maskUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#fff" />
      <rect x="8" y="8" width="84" height="84" fill="#000" />
    </mask>
  </defs>
  <rect width="100" height="100" fill="#b9ccd7" fill-opacity="0.5" mask="url(#pocketRim)" />
  <rect x="8" y="8" width="84" height="84" stroke="#26414f" stroke-opacity="0.32" stroke-width="0.6" />
  <rect x="1.2" y="1.2" width="97.6" height="97.6" stroke="#26414f" stroke-opacity="0.22" stroke-width="0.6" />
  <!-- top opening of the pocket reads as a lighter seam -->
  <rect x="1.2" y="1.2" width="97.6" height="4" fill="#ffffff" fill-opacity="0.55" />
  <rect x="1.2" y="5.2" width="97.6" height="0.6" fill="#26414f" fill-opacity="0.18" />
</svg>
