<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>壳 · 真布局预览</title>
    <style>
      :root {
        --ink: #1f2a24; --muted: #6b6258; --line: rgba(42, 64, 51, 0.14);
        --nav-bg: #f3efe7; --nav-active-ink: #9a4030;
        --plate: #efe6d6; --shadow: 0 10px 26px rgba(42, 36, 28, 0.1);
        --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --bg:
          radial-gradient(ellipse 120% 70% at 8% -18%, rgba(212, 168, 120, 0.34), transparent 56%),
          radial-gradient(ellipse 80% 55% at 100% 108%, rgba(90, 70, 48, 0.07), transparent 52%),
          linear-gradient(168deg, #f6f1e8 0%, #efe8dc 46%, #e9e1d4 100%);
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px 12px 40px; font-family: var(--font); color: var(--ink); background: #d9d0c2; }
      h1.doc { margin: 0 0 8px; font-size: 1.15rem; }
      .note { margin: 0 0 14px; color: #5a5248; font-size: 0.88rem; max-width: 56ch; }
      .phones { display: flex; flex-wrap: wrap; gap: 18px; }
      .phone {
        width: min(100%, 360px); height: 640px;
        background: var(--bg);
        border-radius: 22px; border: 1px solid rgba(42,36,28,.18);
        box-shadow: 0 16px 40px rgba(42,36,28,.14);
        display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
      }
      .topbar {
        z-index: 20; padding: 12px 16px 10px;
        background: var(--nav-bg);
        border-bottom: 1px solid var(--line);
        font-weight: 700; letter-spacing: -0.03em;
      }
      .content {
        min-height: 0; overflow-y: auto; padding: 16px;
        display: grid; gap: 12px; align-content: start;
      }
      .label { margin: 0 0 6px; font-size: 0.75rem; color: #5a5248; }
      .page-head { margin-bottom: 4px; }
      .page-title { margin: 0; font-size: 1.45rem; font-weight: 700; letter-spacing: -0.03em; }
      .lede { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; max-width: 42ch; }
      .covers { display: grid; gap: 18px; padding-bottom: 8px; }
      .media {
        position: relative; aspect-ratio: 3/2; border-radius: 12px; overflow: hidden;
        background: var(--plate); box-shadow: var(--shadow);
      }
      .media .window {
        position: absolute; top: 6%; left: 6%; width: 88%; height: 88%; overflow: hidden;
      }
      .media .photo { width: 100%; height: 100%; object-fit: cover; display: block; }
      .media .frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 1; }
      .meta strong { display: block; font-size: 1.12rem; }
      .meta span { color: var(--muted); font-size: 0.9rem; }
      .map-fake {
        height: 280px; border-radius: 14px; border: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(168, 186, 168, 0.28), transparent 55%),
          #e4ddd0;
      }
      .nav {
        z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr);
        padding: 0 4px 8px;
        background: var(--nav-bg);
        border-top: 1px solid var(--line);
      }
      .nav span {
        position: relative; text-align: center; font-size: 0.86rem;
        color: var(--muted); padding: 12px 6px 14px; letter-spacing: 0.02em;
      }
      .nav span.on { color: var(--nav-active-ink); font-weight: 700; }
      .nav span.on::after {
        content: ""; position: absolute; left: 22%; right: 22%; bottom: 6px;
        height: 2px; border-radius: 1px; background: var(--nav-active-ink);
      }
    </style>
  </head>
  <body>
    <h1 class="doc">壳 · 真布局预览</h1>
    <p class="note">
      顶栏与底栏是壳的两行，主区自己滚。纸纹槽空着，用纸色 token。
      四 Tab 页头同一套字号。封面墙滚到底栏时不应穿模。
    </p>
    <div class="phones">
      <div>
        <p class="label">1 · 旅途（封面墙滚动）</p>
        <div class="phone">
          <div class="topbar">BioTrace</div>
          <div class="content">
            <header class="page-head">
              <h2 class="page-title">旅途</h2>
              <p class="lede">每一次出门，都是一本新相册。</p>
            </header>
            <div class="covers">
              <article>
                <div class="media">
                  <div class="window"><img class="photo" src="/trips/_sample-photo.jpg" alt="" /></div>
                  <img class="frame" src="/trips/daylight/cover-frame.svg" alt="" />
                </div>
                <div class="meta"><strong>海岸线</strong><span>12 张</span></div>
              </article>
              <article>
                <div class="media">
                  <div class="window"><img class="photo" src="/trips/_sample-photo.jpg" alt="" /></div>
                  <img class="frame" src="/trips/daylight/cover-frame.svg" alt="" />
                </div>
                <div class="meta"><strong>林缘</strong><span>8 张</span></div>
              </article>
              <article>
                <div class="media">
                  <div class="window"><img class="photo" src="/trips/_sample-photo.jpg" alt="" /></div>
                  <img class="frame" src="/trips/daylight/cover-frame.svg" alt="" />
                </div>
                <div class="meta"><strong>城市边</strong><span>5 张</span></div>
              </article>
            </div>
          </div>
          <nav class="nav">
            <span class="on">旅途</span><span>地图</span><span>图鉴</span><span>我的</span>
          </nav>
        </div>
      </div>
      <div>
        <p class="label">2 · 地图（页头对齐）</p>
        <div class="phone">
          <div class="topbar">BioTrace</div>
          <div class="content">
            <header class="page-head">
              <h2 class="page-title">地图</h2>
              <p class="lede">点一下落点可看详情；再点空白处取消选中。</p>
            </header>
            <div class="map-fake" aria-hidden="true"></div>
          </div>
          <nav class="nav">
            <span>旅途</span><span class="on">地图</span><span>图鉴</span><span>我的</span>
          </nav>
        </div>
      </div>
      <div>
        <p class="label">3 · 图鉴</p>
        <div class="phone">
          <div class="topbar">BioTrace</div>
          <div class="content">
            <header class="page-head">
              <h2 class="page-title">图鉴</h2>
              <p class="lede">收下的证书，都在这里。</p>
            </header>
          </div>
          <nav class="nav">
            <span>旅途</span><span>地图</span><span class="on">图鉴</span><span>我的</span>
          </nav>
        </div>
      </div>
      <div>
        <p class="label">4 · 我的</p>
        <div class="phone">
          <div class="topbar">BioTrace</div>
          <div class="content">
            <header class="page-head">
              <h2 class="page-title">我的</h2>
            </header>
          </div>
          <nav class="nav">
            <span>旅途</span><span>地图</span><span>图鉴</span><span class="on">我的</span>
          </nav>
        </div>
      </div>
    </div>
  </body>
</html>
