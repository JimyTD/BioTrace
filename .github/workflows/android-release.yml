# BioTrace Android 侧载包：签名 release APK → Artifact / GitHub Release
# 触发：打 tag `android-v*`，或 Actions 里手动 Run workflow
# Secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD

name: Android Release APK

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 android-v 前缀），如 1.0.0"
        required: true
        type: string
      server_url:
        description: "壳内加载的公网源（无尾斜杠）"
        required: false
        default: "http://106.53.188.20"
        type: string
      create_release:
        description: "是否创建 GitHub Release 并挂上 APK"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "$TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must look like android-v1.0.0, got: $TAG"
              exit 1
            fi
            VERSION_NAME="${TAG#android-v}"
          else
            VERSION_NAME="${{ inputs.version }}"
            if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must look like 1.0.0, got: $VERSION_NAME"
              exit 1
            fi
          fi
          IFS=. read -r MAJ MIN PAT <<< "$VERSION_NAME"
          VERSION_CODE=$((10#$MAJ * 10000 + 10#$MIN * 100 + 10#$PAT))
          if [[ "$VERSION_CODE" -lt 1 ]]; then
            echo "::error::versionCode resolved to $VERSION_CODE"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=android-v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Resolve server URL
        id: server
        shell: bash
        env:
          INPUT_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.server_url || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_URL}" ]]; then
            URL="${INPUT_URL}"
          else
            URL="http://106.53.188.20"
          fi
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Server URL: $URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Capacitor sync
        env:
          BIOTRACE_SERVER_URL: ${{ steps.server.outputs.url }}
        run: pnpm mobile:sync

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/biotrace-release.jks"
          # do not print keystore paths with listing of secrets
          test -s "${RUNNER_TEMP}/biotrace-release.jks"

      - name: Build signed release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then
              echo "::error::Missing secret $v"
              exit 1
            fi
          done
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -PbiotraceVersionName="${{ steps.ver.outputs.version_name }}" \
            -PbiotraceVersionCode="${{ steps.ver.outputs.version_code }}" \
            -Pandroid.injected.signing.store.file="${RUNNER_TEMP}/biotrace-release.jks" \
            -Pandroid.injected.signing.store.password="${ANDROID_KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${ANDROID_KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "$APK" || ! -f "$APK" ]]; then
            echo "::error::Release APK not found"
            find apps/mobile/android/app/build/outputs -type f -print || true
            exit 1
          fi
          OUT="BioTrace-${{ steps.ver.outputs.version_name }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioTrace-${{ steps.ver.outputs.version_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: >
          github.ref_type == 'tag' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: Android ${{ steps.ver.outputs.version_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
